<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Accuracy Testing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    h1 {
      color: #2d3748;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718096;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .upload-section {
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }

    .upload-section:hover {
      border-color: #4299e1;
      background: #f7fafc;
    }

    .upload-section.active {
      border-color: #4299e1;
      background: #ebf8ff;
    }

    #fileInput {
      display: none;
    }

    .upload-text {
      color: #4a5568;
      font-size: 14px;
      margin-top: 10px;
    }

    .preview-container {
      margin: 20px 0;
      text-align: center;
      display: none;
    }

    .preview-image {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .id-type-selector {
      margin-bottom: 20px;
    }

    .id-type-selector label {
      display: block;
      font-size: 14px;
      color: #2d3748;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .id-type-selector select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #4299e1;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #3182ce;
    }

    .btn-primary:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #2d3748;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #cbd5e0;
    }

    .status-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status-message.info {
      background: #bee3f8;
      color: #2c5282;
      display: block;
    }

    .status-message.success {
      background: #c6f6d5;
      color: #22543d;
      display: block;
    }

    .status-message.error {
      background: #fed7d7;
      color: #742a2a;
      display: block;
    }

    .results-section {
      display: none;
    }

    .results-section.show {
      display: block;
    }

    .results-title {
      color: #2d3748;
      font-size: 18px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .field-item {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 15px;
    }

    .field-label {
      font-size: 12px;
      color: #718096;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-value {
      font-size: 16px;
      color: #2d3748;
      font-weight: 500;
      word-wrap: break-word;
    }

    .field-value.empty {
      color: #a0aec0;
      font-style: italic;
    }

    .field-value.success {
      color: #38a169;
    }

    .raw-text-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .raw-text-label {
      font-size: 12px;
      color: #718096;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .raw-text-content {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 300px;
      overflow-y: auto;
      color: #4a5568;
      line-height: 1.6;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .test-history {
      margin-top: 20px;
    }

    .test-item {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .test-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }

    .test-number {
      font-weight: 600;
      color: #2d3748;
    }

    .test-confidence {
      color: #4299e1;
      font-weight: 600;
    }

    .test-results {
      font-size: 13px;
      color: #4a5568;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>OCR Accuracy Testing</h1>
      <p class="subtitle">Upload ID images to test extraction accuracy</p>

      <div class="id-type-selector">
        <label for="idTypeSelect">Select ID Type</label>
        <select id="idTypeSelect">
          <option value="">-- Choose ID Type --</option>
          <option value="philhealth">PhilHealth ID</option>
          <option value="drivers_license">Driver's License</option>
          <option value="umid">UMID</option>
          <option value="philsys">PhilSys (National ID)</option>
          <option value="pagibig">PAG-IBIG</option>
          <option value="postal">Postal ID</option>
        </select>
      </div>

      <div class="upload-section" id="uploadZone">
        <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
        <div class="upload-text">
          <strong>Click to upload</strong> or drag and drop<br>
          PNG, JPG only
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">

      <div class="preview-container" id="previewContainer">
        <img id="previewImage" class="preview-image" alt="Preview">
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="scanBtn" disabled>
          <span id="scanBtnText">Scan ID</span>
        </button>
        <button class="btn btn-secondary" id="clearBtn" disabled>Clear</button>
      </div>

      <div class="status-message" id="statusMessage"></div>
    </div>

    <div class="card results-section" id="resultsSection">
      <h2 class="results-title">Latest Scan Results</h2>
      
      <div class="field-grid">
        <div class="field-item">
          <div class="field-label">Full Name</div>
          <div class="field-value" id="resultName">--</div>
        </div>

        <div class="field-item">
          <div class="field-label">Birthday</div>
          <div class="field-value" id="resultBirthday">--</div>
        </div>

        <div class="field-item">
          <div class="field-label">Sex</div>
          <div class="field-value" id="resultSex">--</div>
        </div>

        <div class="field-item">
          <div class="field-label">Address</div>
          <div class="field-value" id="resultAddress">--</div>
        </div>

        <div class="field-item">
          <div class="field-label">ID Type</div>
          <div class="field-value" id="resultIDType">--</div>
        </div>

        <div class="field-item">
          <div class="field-label">Confidence Score</div>
          <div class="field-value" id="resultConfidence">--</div>
        </div>
      </div>

      <div class="raw-text-section">
        <div class="raw-text-label">Raw OCR Text Output</div>
        <div class="raw-text-content" id="rawText">No text extracted yet</div>
      </div>

      <div class="test-history" id="testHistory"></div>
    </div>
  </div>

<script type="module">
    import Tesseract from 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js';

    // OCR Configuration
    const OCR_CONFIG = {
      lang: 'eng',
      oem: 3,
      psm: 6,
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz -.\',',
      load_system_dawg: '0',
      load_freq_dawg: '0',
      load_unambig_dawg: '0',
      load_punc_dawg: '0',
      load_number_dawg: '0',
      load_bigram_dawg: '0'
    };

    // Copy extraction functions from tesseractOCR.js
    const extractPhilHealthName = (lines) => {
      console.log('📋 PhilHealth ID detected');
      console.log('📄 All Lines:', lines);
      
      // Filter out noise first
      const cleanLines = lines.filter(line => {
        const cleanLine = line.replace(/\s+/g, ' ').trim();
        if (cleanLine.length === 0) return false;
        
        const letterCount = (cleanLine.match(/[A-Z]/g) || []).length;
        const totalLength = cleanLine.length;
        const letterRatio = letterCount / totalLength;
        
        if (letterRatio < 0.5) return false;
        
        const noiseChars = (cleanLine.match(/[\[\]\{\}\(\)\|\=\+\*\@\#\$\%\^\&]/g) || []).length;
        if (noiseChars > 3) return false;
        
        if (cleanLine.length < 5 || cleanLine.length > 100) return false;
        
        return true;
      });
      
      console.log('📄 Clean Lines:', cleanLines);
      
      const nameWithCommaPattern = /^([A-Z][A-Z\s\-']{2,25}),\s*([A-Z][A-Z\s\-']{4,40})$/;
      
      for (let line of cleanLines) {
        const cleanLine = line.replace(/\s+/g, ' ').trim();
        
        if (cleanLine.includes('PHILHEALTH') || 
            cleanLine.includes('PHILIPPINE') ||
            cleanLine.includes('HEALTH') ||
            cleanLine.includes('INSURANCE') ||
            cleanLine.includes('CORPORATION') ||
            cleanLine.includes('REPUBLIC') ||
            /^\d{2}[-=]\d{9}[-=]/.test(cleanLine) ||
            cleanLine.length < 10 ||
            cleanLine.length > 60) {
          continue;
        }
        
        const match = cleanLine.match(nameWithCommaPattern);
        if (match) {
          const surname = match[1].trim();
          const givenMiddle = match[2].trim();
          
          if (!/[0-9\{\}\[\]\(\)\=\|\+\*\@\#\$\%\^\&]/.test(surname) &&
              !/[0-9\{\}\[\]\(\)\=\|\+\*\@\#\$\%\^\&]/.test(givenMiddle)) {
            
            const surnameWords = surname.split(/\s+/).filter(w => w.length > 0);
            const givenMiddleWords = givenMiddle.split(/\s+/).filter(w => w.length > 0);
            
            if (surnameWords.length >= 1 && surnameWords.length <= 2 &&
                givenMiddleWords.length >= 2 &&
                surname.length >= 3 && surname.length <= 25 &&
                givenMiddle.length >= 5) {
              
              const fullName = `${givenMiddle} ${surname}`;
              console.log('✅ Extracted Full Name:', fullName);
              return fullName;
            }
          }
        }
      }
      
      console.log('❌ No valid name pattern found');
      return null;
    };

    const extractPhilHealthSex = (lines) => {
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        
        const sexPattern = /(APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER|JANUARY|FEBRUARY|MARCH)\s+\d{1,2},?\s+\d{4}\s*[-–—]\s*(MALE|FEMALE)/i;
        const sexMatch = line.match(sexPattern);
        
        if (sexMatch) {
          return sexMatch[2].toUpperCase() === 'FEMALE' ? 'Female' : 'Male';
        }
        
        if (line.endsWith('FEMALE') || line.endsWith('MALE')) {
          return line.endsWith('FEMALE') ? 'Female' : 'Male';
        }
        
        if (line === 'FEMALE' || line === 'MALE') {
          if (i > 0 && /\d{4}/.test(lines[i - 1])) {
            return line === 'FEMALE' ? 'Female' : 'Male';
          }
        }
      }
      
      return null;
    };

    const extractPhilHealthBirthday = (lines) => {
      const monthNames = {
        'JANUARY': '01', 'FEBRUARY': '02', 'MARCH': '03', 'APRIL': '04',
        'MAY': '05', 'JUNE': '06', 'JULY': '07', 'AUGUST': '08',
        'SEPTEMBER': '09', 'OCTOBER': '10', 'NOVEMBER': '11', 'DECEMBER': '12'
      };
      
      for (let line of lines) {
        const datePattern = /(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)\s+(\d{1,2}),?\s+(\d{4})/i;
        const match = line.match(datePattern);
        
        if (match) {
          const monthText = match[1].toUpperCase();
          const day = match[2].padStart(2, '0');
          const year = match[3];
          const month = monthNames[monthText];
          
          if (month) {
            return `${year}-${month}-${day}`;
          }
        }
      }
      
      return null;
    };

    const extractPhilHealthAddress = (lines) => {
      let addressCandidates = [];
      
      for (let line of lines) {
        if (line.includes('PHILHEALTH') || 
            line.includes('PHILIPPINE') ||
            /^\d{2}[-=]\d{9}[-=]/.test(line) ||
            /^([A-Z]+),\s*([A-Z\s]+)$/.test(line) ||
            /(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)\s+\d{1,2},?\s+\d{4}/i.test(line) ||
            line === 'FEMALE' ||
            line === 'MALE' ||
            line.length < 10) {
          continue;
        }
        
        const hasAddressKeywords = 
          line.includes('FABIE') ||
          line.includes('STREET') ||
          (line.includes('BGY') && /\d/.test(line)) ||
          line.includes('PACO') ||
          line.includes('DISTRICT') ||
          /\d{3,4}[-\s]*[A-Z]/.test(line);
        
        if (hasAddressKeywords) {
          let cleaned = line
            .replace(/\s+/g, ' ')
            .replace(/PACQO/g, 'PACO')
            .replace(/CARIE/g, 'FABIE')
            .replace(/DIST\s*RIC\s*R?=?/gi, 'DISTRICT')
            .replace(/[=\|]+/g, '')
            .trim();
          
          addressCandidates.push({ line: cleaned, score: 0 });
        }
      }
      
      for (let candidate of addressCandidates) {
        if (candidate.line.includes('FABIE')) candidate.score += 3;
        if (candidate.line.includes('STREET')) candidate.score += 2;
        if (candidate.line.includes('BGY')) candidate.score += 2;
        if (candidate.line.includes('PACO')) candidate.score += 2;
        if (candidate.line.includes('DISTRICT')) candidate.score += 2;
      }
      
      if (addressCandidates.length > 0) {
        addressCandidates.sort((a, b) => b.score - a.score);
        return addressCandidates[0].line;
      }
      
      return null;
    };

    const extractDriversLicenseName = (lines) => {
      const nameWithCommaPattern = /^([A-Z\s]+),\s*([A-Z\s]+)$/;
      
      for (let line of lines) {
        if (line.includes('LICENSE') || line.includes('DRIVER') ||
            line.includes('REPUBLIC') || /^N\d{2}-\d{2}-\d{6}$/.test(line)) {
          continue;
        }
        
        const match = line.match(nameWithCommaPattern);
        if (match) {
          const surname = match[1].trim();
          const firstMiddle = match[2].trim();
          const surnameWords = surname.split(/\s+/);
          const firstMiddleWords = firstMiddle.split(/\s+/);
          
          if (surnameWords.length >= 1 && surnameWords.length <= 3 &&
              firstMiddleWords.length >= 2 && firstMiddleWords.length <= 5) {
            return `${firstMiddle} ${surname}`;
          }
        }
      }
      return null;
    };

    const extractDriversLicenseSex = (lines) => {
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.includes('SEX')) {
          const sexMatch = line.match(/SEX[:\s]*([MF])/i);
          if (sexMatch) {
            return sexMatch[1].toUpperCase() === 'M' ? 'Male' : 'Female';
          }
        }
        const contextPattern = /^(PHL|FILIPINO)\s+([MF])\s+\d{4}\/\d{2}\/\d{2}/i;
        const contextMatch = line.match(contextPattern);
        if (contextMatch) {
          return contextMatch[2].toUpperCase() === 'M' ? 'Male' : 'Female';
        }
      }
      return null;
    };

    const extractDriversLicenseBirthday = (lines) => {
      for (let line of lines) {
        const directPattern = /(\d{4})\/(\d{2})\/(\d{2})/;
        const directMatch = line.match(directPattern);
        if (directMatch && !line.includes('EXPIRATION')) {
          return `${directMatch[1]}-${directMatch[2]}-${directMatch[3]}`;
        }
      }
      return null;
    };

    const extractDriversLicenseAddress = (lines) => {
      let addressLines = [];
      let foundAddressLabel = false;
      
      for (let line of lines) {
        if (line.includes('ADDRESS')) {
          foundAddressLabel = true;
          const addressPart = line.replace(/ADDRESS[:\s]*/i, '').trim();
          if (addressPart.length > 5) {
            addressLines.push(addressPart);
          }
          continue;
        }
        
        if (foundAddressLabel && addressLines.length < 2) {
          if (line.includes('LICENSE NO') || /^N\d{2}-\d{2}-\d{6}$/.test(line)) {
            continue;
          }
          if (/\d/.test(line) || line.includes('STREET') || line.includes('CITY')) {
            addressLines.push(line.trim());
          }
        }
      }
      
      return addressLines.length > 0 ? addressLines.join(', ') : null;
    };

    // Generic extraction for other ID types
    const extractGenericName = (lines) => {
      for (let line of lines) {
        const nameWithCommaPattern = /^([A-Z\s]+),\s*([A-Z\s]+)$/;
        const match = line.match(nameWithCommaPattern);
        if (match) {
          const surname = match[1].trim();
          const firstMiddle = match[2].trim();
          return `${firstMiddle} ${surname}`;
        }
      }
      return null;
    };

    const extractNameByIDType = (text, idType) => {
      const lines = text.split('\n').map(line => line.trim().toUpperCase()).filter(line => line.length > 0);
      
      switch(idType) {
        case 'philhealth':
          return extractPhilHealthName(lines);
        case 'drivers_license':
          return extractDriversLicenseName(lines);
        default:
          return extractGenericName(lines);
      }
    };

    const extractFieldsByIDType = (text, idType) => {
      const lines = text.split('\n').map(line => line.trim().toUpperCase()).filter(line => line.length > 0);
      
      let sex = null, birthday = null, address = null;
      
      if (idType === 'philhealth') {
        sex = extractPhilHealthSex(lines);
        birthday = extractPhilHealthBirthday(lines);
        address = extractPhilHealthAddress(lines);
      } else if (idType === 'drivers_license') {
        sex = extractDriversLicenseSex(lines);
        birthday = extractDriversLicenseBirthday(lines);
        address = extractDriversLicenseAddress(lines);
      }
      
      return { sex, birthday, address };
    };

    // Main OCR function
    const processIDWithOCR = async (imageData, idType) => {
      try {
        console.log('Starting OCR for:', idType);
        
        const { data: { text, confidence } } = await Tesseract.recognize(imageData, 'eng', {
          logger: m => {
            if (m.status === 'recognizing text') {
              console.log('Progress:', Math.round(m.progress * 100) + '%');
            }
          },
          ...OCR_CONFIG
        });
        
        console.log('Raw OCR Text:', text);
        console.log('Confidence:', confidence);
        
        const name = extractNameByIDType(text, idType);
        const fields = extractFieldsByIDType(text, idType);
        
        return {
          success: name !== null,
          name: name,
          sex: fields.sex,
          birthday: fields.birthday,
          address: fields.address,
          idType: idType,
          rawText: text,
          confidence: confidence,
          message: name ? 'Extraction successful' : 'Could not extract name'
        };
      } catch (error) {
        console.error('OCR Error:', error);
        return {
          success: false,
          name: null,
          sex: null,
          birthday: null,
          address: null,
          rawText: '',
          confidence: 0,
          message: 'OCR failed: ' + error.message
        };
      }
    };

    // UI Logic
    let currentImage = null;
    let selectedIDType = null;
    let testCount = 0;

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const idTypeSelect = document.getElementById('idTypeSelect');
    const scanBtn = document.getElementById('scanBtn');
    const clearBtn = document.getElementById('clearBtn');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const statusMessage = document.getElementById('statusMessage');
    const resultsSection = document.getElementById('resultsSection');
    const scanBtnText = document.getElementById('scanBtnText');

    idTypeSelect.addEventListener('change', (e) => {
      selectedIDType = e.target.value;
      updateScanButton();
    });

    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('active');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('active');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('active');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      if (!file.type.match('image.*')) {
        showStatus('Please upload PNG or JPG only', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        currentImage = e.target.result;
        previewImage.src = e.target.result;
        previewContainer.style.display = 'block';
        clearBtn.disabled = false;
        updateScanButton();
        showStatus('Image loaded: ' + file.name, 'info');
      };
      reader.readAsDataURL(file);
    }

    function updateScanButton() {
      scanBtn.disabled = !(currentImage && selectedIDType);
    }

    scanBtn.addEventListener('click', async () => {
      if (!currentImage || !selectedIDType) return;

      scanBtn.disabled = true;
      scanBtnText.innerHTML = '<span class="loading-spinner"></span>Scanning...';
      showStatus('Processing OCR...', 'info');

      try {
        const result = await processIDWithOCR(currentImage, selectedIDType);

        scanBtn.disabled = false;
        scanBtnText.textContent = 'Scan ID';

        displayResults(result);
        
        if (result.success) {
          showStatus('Scan completed successfully', 'success');
        } else {
          showStatus(result.message, 'error');
        }

        addToHistory(result);
      } catch (error) {
        scanBtn.disabled = false;
        scanBtnText.textContent = 'Scan ID';
        showStatus('Error: ' + error.message, 'error');
        console.error(error);
      }
    });

    clearBtn.addEventListener('click', () => {
      currentImage = null;
      selectedIDType = null;
      fileInput.value = '';
      idTypeSelect.value = '';
      previewContainer.style.display = 'none';
      scanBtn.disabled = true;
      clearBtn.disabled = true;
      hideResults();
      statusMessage.className = 'status-message';
    });

    function displayResults(result) {
      document.getElementById('resultName').textContent = result.name || 'Not detected';
      document.getElementById('resultName').className = result.name ? 'field-value success' : 'field-value empty';

      document.getElementById('resultBirthday').textContent = result.birthday || 'Not detected';
      document.getElementById('resultBirthday').className = result.birthday ? 'field-value success' : 'field-value empty';

      document.getElementById('resultSex').textContent = result.sex || 'Not detected';
      document.getElementById('resultSex').className = result.sex ? 'field-value success' : 'field-value empty';

      document.getElementById('resultAddress').textContent = result.address || 'Not detected';
      document.getElementById('resultAddress').className = result.address ? 'field-value success' : 'field-value empty';

      const idTypeLabels = {
        'philhealth': 'PhilHealth ID',
        'drivers_license': "Driver's License",
        'umid': 'UMID',
        'philsys': 'PhilSys',
        'pagibig': 'PAG-IBIG',
        'postal': 'Postal ID'
      };
      document.getElementById('resultIDType').textContent = idTypeLabels[result.idType] || 'Unknown';

      document.getElementById('resultConfidence').textContent = result.confidence.toFixed(1) + '%';

      document.getElementById('rawText').textContent = result.rawText || 'No text';

      resultsSection.classList.add('show');
    }

    function addToHistory(result) {
      testCount++;
      const historyContainer = document.getElementById('testHistory');
      
      const testItem = document.createElement('div');
      testItem.className = 'test-item';
      testItem.innerHTML = `
        <div class="test-header">
          <span class="test-number">Test #${testCount}</span>
          <span class="test-confidence">${result.confidence.toFixed(1)}%</span>
        </div>
        <div class="test-results">
          <strong>Name:</strong> ${result.name || 'Not detected'}<br>
          <strong>Birthday:</strong> ${result.birthday || 'Not detected'}<br>
          <strong>Sex:</strong> ${result.sex || 'Not detected'}<br>
          <strong>Address:</strong> ${result.address || 'Not detected'}
        </div>
      `;
      
      historyContainer.insertBefore(testItem, historyContainer.firstChild);
    }

    function hideResults() {
      resultsSection.classList.remove('show');
    }

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;
    }
  </script>
</body>
</html>
